# Add under `models:` in /etc/llama-swap/config.yaml on the Proxmox LXC,
# and add yt-transcribe-gpu to GPU_CONTAINERS in /etc/llama-swap/unraid.env.
  yt-transcribe-gpu:
    name: "yt-transcribe GPU worker"
    cmd: /opt/llama-swap/unraid-container.sh run yt-transcribe-gpu
    cmdStop: /opt/llama-swap/unraid-container.sh stop yt-transcribe-gpu ${PID}
    proxy: http://192.168.1.20:8766
    checkEndpoint: /health
    unloadTimeout: 60
    unlisted: true   # not an LLM: keep it out of /v1/models
    ttl: 600         # stop the worker after 10 idle minutes
